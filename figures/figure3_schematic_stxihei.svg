<rect x="1020" y="150" width="510" height="300" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1275" y="190" font-size="29" text-anchor="middle" dominant-baseline="middle" class="bold">总异质性预算</text>
<text x="1275" y="235" font-size="28" text-anchor="middle" dominant-baseline="middle">B = (1/L) Σ s(ℓ)²</text>
<text x="1275" y="285" font-size="21" text-anchor="middle" dominant-baseline="middle">B：总异质性预算；Σ：对 ℓ=1…L 求和</text>
<text x="1275" y="321" font-size="21" text-anchor="middle" dominant-baseline="middle">L：层数（本图为 4）；ℓ：层序号</text>
<text x="1275" y="357" font-size="21" text-anchor="middle" dominant-baseline="middle">s(ℓ)：第 ℓ 层的尺度系数</text>
<text x="1275" y="411" font-size="23" text-anchor="middle" dominant-baseline="middle" class="bold">递减配置：B = 0.271875</text>
<text x="1275" y="492" font-size="22" text-anchor="middle" dominant-baseline="middle">递减与反向仅改变分配位置，B 严格相同</text>
<text x="1275" y="528" font-size="22" text-anchor="middle" dominant-baseline="middle">均匀配置近似匹配；固定配置为零预算</text>
<rect x="1020" y="565" width="510" height="239" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="1275" y="605" font-size="27" text-anchor="middle" dominant-baseline="middle" class="bold">对照配置</text>
<text x="1275" y="651" font-size="21" text-anchor="middle" dominant-baseline="middle">均匀剖面：各层相同（B = 0.272484）</text>
<text x="1275" y="698" font-size="21" text-anchor="middle" dominant-baseline="middle">反向剖面：前窄后宽（B = 0.271875）</text>
<text x="1275" y="745" font-size="21" text-anchor="middle" dominant-baseline="middle">固定剖面：无异质性（B = 0）</text>
</svg>
